apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-static-secret-playground
  namespace: playground
spec:
  vaultAuthRef: vault-auth-playground
  mount: "secret/eljavatar_k8s/kv-v2"
  type: kv-v2
  path: "playground/nginx-app"
  #version: 2
  refreshAfter: 120s
  destination:
    create: true
    name: playground-nginx-secret

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-static-secret-demo
  namespace: playground
spec:
  vaultAuthRef: vault-auth-demo
  mount: "secret/eljavatar_k8s/kv-v2"
  type: kv-v2
  path: "demo"
  #version: 2
  refreshAfter: 3600s
  destination:
    create: true
    name: demo-secret
