# https://argo-rollouts.readthedocs.io/en/stable/features/specification/

apiVersion: v1
kind: Namespace
metadata:
  name: canary-demo
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-canary
  namespace: canary-demo
spec:
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: rollout-canary
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-canary
  namespace: canary-demo
spec:
  replicas: 5
  selector:
    matchLabels:
      app: rollout-canary
  template:
    metadata:
      labels:
        app: rollout-canary
    spec:
      nodeSelector:
        kubernetes.io/hostname: "worker-apps-01"
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # non‑root UID that the image can run as
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:blue
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  revisionHistoryLimit: 2
  strategy:
    canary: #Indicates that the rollout should use the Canary strategy
      maxSurge: '25%'
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: {} # pause indefinitely
        - setWeight: 40
        - pause: {duration: 30}
        - setWeight: 60
        - pause: {duration: 30}
        - setWeight: 80
        - pause: {duration: 30}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-demo-httproute
  namespace: canary-demo
spec:
  parentRefs:
    - name: external-gateway
      namespace: gateway-api-system # Namespace donde está el Gateway
      sectionName: https-local # Se amarra específicamente al listener HTTPS
  hostnames:
    - "canary-demo.eljavatar.home"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rollout-canary # Service de Kubernetes normal (ClusterIP)
          port: 80
