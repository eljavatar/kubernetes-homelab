# https://unixorn.github.io/post/homelab/k8s/01-talos-with-cilium-cni-on-proxmox/
# https://www.digitalocean.com/community/tutorials/kubernetes-gateway-api-tutorial-cilium-ingress-alternative#step-1-deploy-a-sample-app
# https://gist.github.com/stevenyepes/4149acfed3a8ff84127b59f85eb6f979

apiVersion: v1
kind: Namespace
metadata:
  name: playground
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-eso-auth-sa
  namespace: playground
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-sa
  namespace: playground
  annotations:
    vault.hashicorp.com/alias-metadata-env: demo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-auth-eljavatar-k8s-kv-v2-playground
  namespace: playground
spec:
  provider:
    vault:
      # La IP y puerto del contenedor LXC de Proxmox de HashiCorp Vault
      # También podríamos usar "https://vault.eljavatar.home:8200" ya que en
      # el hosts del CoreDNS del clúster configuramos esa URL
      server: "https://192.168.0.20:8200"
      path: "secret/eljavatar_k8s/kv-v2"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "eljavatar_k8s/kubernetes"
          role: "global-dynamic-reading-role"
          serviceAccountRef:
            name: vault-eso-auth-sa
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-auth-eljavatar-k8s-kv-v2-demo
  namespace: playground
spec:
  provider:
    vault:
      # La URL y puerto del contenedor LXC de Proxmox de HashiCorp Vault
      server: "https://vault.eljavatar.home:8200"
      path: "secret/eljavatar_k8s/kv-v2"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "eljavatar_k8s/kubernetes"
          role: "playground-test-role"
          serviceAccountRef:
            name: playground-sa
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-secret-playground-nginx-app
  namespace: playground
spec:
  refreshInterval: "2m" # Cada cuánto tiempo ESO sincroniza con Vault
  secretStoreRef:
    name: vault-auth-eljavatar-k8s-kv-v2-playground
    kind: SecretStore
  target:
    name: playground-nginx-secret # Este será el nombre del Secret nativo de K8s que creará ESO
    creationPolicy: Owner
  data:
    - secretKey: USERNAME # Llave que tendrá el secreto en Kubernetes
      remoteRef:
        key: playground/nginx-app # Ruta en Vault relativa al path del SecretStore
        property: NGINX_USERNAME # Llave dentro de Vault
    - secretKey: PASSWORD
      remoteRef:
        key: playground/nginx-app
        property: NGINX_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-secret-demo
  namespace: playground
spec:
  refreshInterval: "1h" # ESO revisará Vault cada X tiempo en busca de cambios
  secretStoreRef:
    name: vault-auth-eljavatar-k8s-kv-v2-demo
    kind: SecretStore
  target:
    name: demo-secret # Este será el nombre del Secret nativo de K8s que creará ESO
    creationPolicy: Owner
  data:
    - secretKey: USERNAME # Llave que tendrá el secreto en Kubernetes
      remoteRef:
        key: demo # Ruta en Vault relativa al path del SecretStore
        property: TEST_USERNAME # Llave dentro de Vault
    - secretKey: PASSWORD
      remoteRef:
        key: demo
        property: TEST_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: playground-nginx-service
  namespace: playground
spec:
  selector:
    app: playground-nginx-pod
  ports:
    - name: http
      port: 80 # This is what the service is listening on, and what will be routed to
      targetPort: 8080 # Port the pods are listening on, don't route directly here!
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground-nginx-app
  namespace: playground
  annotations:
    # RELOADER: Observa los secretos playground-nginx-secret y demo-secret.
    # Si cambia el contenido de esos secretos, reinicia el pod automáticamente.
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: playground-nginx-pod  # <-- must match pod labels exactly
  replicas: 1
  template:
    metadata:
      labels:
        app: playground-nginx-pod
    spec:
      nodeSelector:
        kubernetes.io/hostname: "worker-apps-01"
      # Talos is very security oriented, so we have to set up the
      # security context explicitly
      # ---------- Pod‑level security settings ----------
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # non‑root UID that the image can run as
        seccompProfile:
          type: RuntimeDefault
        # Uncomment if you need a shared FS group for volume writes
        # fsGroup: 101
      # ---------- Containers ----------
      containers:
        - name: nginx-playground-container
          image: nginxinc/nginx-unprivileged:latest # Alpine, but we force a non‑root UID
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # talos requires us to specify our resources instead of
          # letting k8s YOLO them
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # Inyectamos las llaves del secreto creado por ESO como variables de entorno
            # Del secret playground-nginx-secret
            - name: NGINX_USER
              valueFrom:
                secretKeyRef:
                  name: playground-nginx-secret
                  key: USERNAME
            - name: NGINX_PASS
              valueFrom:
                secretKeyRef:
                  name: playground-nginx-secret
                  key: PASSWORD
            # Del secret demo-secret
            - name: DEMO_USER
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: USERNAME
            - name: DEMO_PASS
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: PASSWORD
          # Comando alternativo para imprimir las variables en los logs y mantener Nginx vivo
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "=== VERIFICANDO SECRETOS DESDE EL POD ==="
              echo "Usuario recuperado del secret playground/nginx-app:  $NGINX_USER"
              echo "Password recuperado del secret playground/nginx-app: $NGINX_PASS"
              echo "Usuario recuperado del secret demo:  $DEMO_USER"
              echo "Password recuperado del secret demo: $DEMO_PASS"
              echo "========================================="
              exec nginx -g 'daemon off;'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: playground-nginx-httproute
  namespace: playground # Namespace de desarrollo
spec:
  parentRefs:
    - name: external-gateway
      namespace: gateway-api-system # Namespace donde está el Gateway
      #sectionName: https-local # Se amarra específicamente al listener HTTPS
  hostnames:
    - "api.eljavatar.home"
    # Si queremos que también esté accesible desde internet:
    # Eventualmente, podríamos tener 2 HTTPRoute, uno para tráfico local y otro para tráfico público
    # Esto sería útil por ejemplo si queremos tener un servicio (como Grafana), que solo sea accesible
    # localmente, pero que podamos activarle el ingreso de tráfico público aplicando un manifiesto
    - "api.eljavatar.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: playground-nginx-service # Service de Kubernetes normal (ClusterIP)
          port: 80 # El puerto en texto plano del contenedor/servicio
    # # También podemos añadir filtros (ej. redirigir HTTP a HTTPS si vinieran por el puerto 80)
    # - filters:
    #     - type: RequestRedirect
    #       requestRedirect:
    #         scheme: https
    #         statusCode: 301 # Redirección permanente segura
