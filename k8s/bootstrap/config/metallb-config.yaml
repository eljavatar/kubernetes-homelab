apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-ip-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.0.70-192.168.0.149 # Rango de IPs reservadas para los servicios de Kubernetes
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
