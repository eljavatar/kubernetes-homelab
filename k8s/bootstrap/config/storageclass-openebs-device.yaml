apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-device
provisioner: openebs.io/local
volumeBindingMode: WaitForFirstConsumer # CRÍTICO: Garantiza que el volumen se cree en el mismo nodo físico donde correrá el pod de la DB
allowVolumeExpansion: false # El aprovisionamiento de bloque crudo directo no soporta expansión en caliente nativa sin LVM
parameters:
  storagepolicy: "device"
