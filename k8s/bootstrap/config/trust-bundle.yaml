apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: cluster-trusted-ca
spec:
  sources:
    - secret:
        name: internal-ca-secret
        key: tls.crt # ca.crt
  target:
    configMap:
      key: internal-ca-bundle.crt # Todos los pods verán este archivo de confianza
    namespaceSelector:
      matchLabels: {}
