apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-cert
  namespace: playground
spec:
  secretName: vault-server-tls-secret
  duration: 720h # 30 días
  renewBefore: 360h # Se renueva automáticamente a los 15 días
  commonName: eljavatar.home
  ipAddresses:
    - 192.168.0.20
  dnsNames:
    - vault.eljavatar.home
  issuerRef:
    name: vault-server-ca-issuer
    kind: ClusterIssuer
