apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-stage-issuer
spec:
  acme:
    # URL de stage para la API ACME
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${PERSONAL_EMAIL} # Correo para alertas de vencimiento
    privateKeySecretRef:
      name: letsencrypt-stage-account-key
    solvers:
      - dns01:
          cloudflare:
            email: ${CLOUDFLARE_ACCOUNT_EMAIL}
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
