apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-vault-cert
  namespace: shared-ops
spec:
  # Se ejecuta cada 8 horas de manera continua. Al ser idempotente y ultra liviano, no consume recursos significativos.
  # Al setearlo para que se ejecute cada 8 horas, me permite saber que si el clúster lo apago por varias semanas,
  # tendré un márgen de un poco más de 33 días para volver a prenderlo antes de que el Job se bloquee.
  schedule: "0 */8 * * *"
  successfulJobsHistoryLimit: 2 # Mantiene sólo los últimos 2 Jobs exitosos en el historial
  failedJobsHistoryLimit: 3     # Mantiene los últimos 3 Jobs fallidos para poder debuggear
  # ttlSecondsAfterFinished: 3600 # Si queremos que se borre automáticamente después de X tiempo
  concurrencyPolicy: Forbid
  # ---> MITIGACIÓN DE APAGÓN DEL CLÚSTER <---
  # Permite que el Job se ejecute de forma tardía si el clúster estuvo apagado
  # hasta por 30 días (adecuado para la frecuencia que le programamos).
  # No importa que este valor sea superior a la frecuencia del Job (8 horas), ya que lo que esta propiedad le dice a
  # a Kubernetes es: "Si te despiertas y ves que este Job se perdió, tienes permiso de ejecutarlo de forma tardía simpre
  # y cuando no hayan pasado más de X segundos desde la primera oportunidad perdida".
  #
  # Sin embargo, lo que hay que tener en cuenta es que Kubernetes cuenta la cantidad de ejecuciones perdidas desde la
  # última vez que se ejecutó el Job, ya que el número de ejecuciones perdidas durante el tiempo que el clúster esté
  # apagado no debe superar las 100, debido a que en caso de que se supere ese valor, Kubernetes por seguridad bloquea
  # el CronJob por completo y no lo vuelve a correr, ya que asume que hubo un error grave del sistema.
  #
  # Entonces, si por ejemplo un job se debe ejecutar cada 2 horas, la última vez que se ejecutó es a las 4 am, el
  # clúster se apagó a las 5 am y se vuelve a encender a las 11 am, la cantidad de ejecuciones perdidas fueron 3, la
  # de las 6, 8 y 10 am, por tanto al ser 3 < 100, el job se ejecutaría a las 11 y el contador vuelve a iniciar en 0).
  #
  # Esto es importante tenerlo en cuenta al momento de decidir cada cuanto debe correr el job, especialmente en
  # entornos de HomeLab donde a veces por cuestiones de ahorro de energía se decide apagar el homelab por varios días
  # o incluso semanas (si por ejemplo nos vamos de vacaciones). Aún así, si se requiere que un job corra cada hora, pero
  # eventualmente sabemos que podemos llegar a taner el clúster apagado, digamos una semana, esto daría 168 ejecuciones
  # perdidas, por tanto, lo que podríamos hacer es pausar el job antes de apagar el clúster.
  #
  # En mi caso, lo voy a setear en 30 días, y como la periodicidad es de 8 horas, esto me daría la posibilidad de que
  # se ejecute el job inmediatamente se prenda el clúster si estuvo hasta 30 días apagado
  startingDeadlineSeconds: 2592000
  jobTemplate:
    spec:
      # ---> MITIGACIÓN DE APAGÓN DEL LXC <---
      # Si no lo configuramos, se ejecutará por defecto 6 veces con una espera Exponencial (que puede ser 10s, 20, 40s, etc.)
      # Como solo nos interesa que el reintento se de en caso que depronto se esté reiniciando el LXC, lo ideal es que el
      # reintento se pueda hacer cada X tiempo (por ejemplo cada 2 o 3 minutos) para darle el tiempo suficiente a que
      # reincie el LXC y corra el job de Anacron (en caso de que el servidor tenga que renovar el certificado).
      # Sin embargo, como no podemos controlar la periodicidad que queremos para los reintentos,
      # lo dejamos en 0 y los reintentos los controlamos por código dentro de la ejecución.
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: vault-cert-syncer-sa
          # restartPolicy=OnFailure sería útil si estamos seguros que el pod no va a fallar, ya que a pesar de que
          # con OnFailure solo se crea una instancia del Pod (con Never cada reintento crea un nuevo pod), en caso
          # de fallo en todos los reintentos, Kubernetes tiende a eliminar el pod después del último reintento
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: "worker-ops-02"
          containers:
            - name: syncer
              image: alpine/kubectl:1.36.0 # Imagen liviana oficial con kubectl
              command:
                # Alpine usa /bin/sh por defecto en lugar de /bin/bash
                - /bin/sh
                - -c
                - |
                  set -e

                  # # En caso de querer enviar una Alerta a Telegram cuando algo falle (ya que esto es crítico)
                  # # ---> FUNCIÓN DE NOTIFICACIÓN <---
                  # enviar_alerta_telegram() {
                  #   # Solo se ejecuta si la última ejecución falló (exit code diferente de 0)
                  #   if [ "$?" -ne 0 ]; then
                  #     echo "🚨 Enviando alerta a Telegram debido a un fallo en el script..."
                      
                  #     MENSAJE="❌ *Homelab Alert: sync-vault-cert falló*%0A%0A"
                  #     MENSAJE="${MENSAJE}• *Pod:* $(hostname)%0A"
                  #     MENSAJE="${MENSAJE}• *Namespace:* external-secrets%0A"
                  #     MENSAJE="${MENSAJE}• *Error:* Revisar logs con \`kubectl logs $(hostname) -n external-secrets\`"
                      
                  #     # Petición silenciosa a la API de Telegram utilizando ParseMode=Markdown
                  #     curl -s -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
                  #       -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  #       -d "text=${MENSAJE}" \
                  #       -d "parse_mode=Markdown" > /dev/null
                  #   fi
                  # }

                  # # Capturar CUALQUIER señal de salida errónea (ERR) o terminación (EXIT)
                  # trap enviar_alerta_telegram EXIT


                  echo "=== Configurando entorno ligero ==="
                  # Instalamos curl y openssl de forma rápida (ya no necesitamos openssh-client)
                  apk add --no-cache curl openssl


                  # =================================================================
                  # 1. DESCARGA DEL CERTIFICADO (LXC DE VAULT)
                  # =================================================================
                  # Reintentará 3 veces esperando 3 minutos (180s) entre cada intento
                  # Esto nos dará tiempo suficiente en caso de que el LXC de Vault se esté reiniciando justo en ese momento
                  echo -e "\n=== Descarga del Certificado de Vault con reintentos controlados ==="
                  MAX_ATTEMPTS=3
                  ATTEMPT=1
                  DOWNLOAD_SUCCESS=false

                  echo "Descargando certificado remoto desde el LXC de Vault..."
                  while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
                    echo "Intento $ATTEMPT de $MAX_ATTEMPTS: Descargando certificado desde el LXC..."
                    if curl -s -f -o /tmp/vault-remote.crt http://192.168.0.20/certs/vault.crt; then
                      DOWNLOAD_SUCCESS=true
                      break
                    fi

                    RETRY_MESSAGE="Reintentando en 3 minutos..."
                    if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                      RETRY_MESSAGE="Este ha sido el último reintento."
                    fi

                    echo "AVISO: No se pudo conectar al LXC en el intento $ATTEMPT. $RETRY_MESSAGE"
                    ATTEMPT=$((ATTEMPT + 1))
                    if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
                      sleep 180
                    fi
                  done

                  if [ "$DOWNLOAD_SUCCESS" = false ]; then
                    ERROR_MESSAGE="ERROR CRÍTICO: El LXC no respondió tras varios reintentos."
                    ERROR_MESSAGE="$ERROR_MESSAGE ¿El LXC está disponible en 192.168.0.20?"
                    ERROR_MESSAGE="$ERROR_MESSAGE ¿Está Nginx corriendo en el LXC?"
                    ERROR_MESSAGE="$ERROR_MESSAGE ¿Existe el certificado en la ruta /certs/vault.crt?"
                    echo "$ERROR_MESSAGE" >&2
                    exit 1
                  fi

                  # Calcular el fingerprint remoto una sola vez para las comparaciones
                  REMOTE_FP=$(openssl x509 -noout -fingerprint -sha256 -in /tmp/vault-remote.crt)
                  echo "Fingerprint Remoto de Vault: $REMOTE_FP"

                  # Variable para rastrear errores globales en los sub-bloques
                  GLOBAL_STATUS=0


                  # =================================================================
                  # 2. BLOQUE SINCRO: EXTERNAL SECRETS OPERATOR (ESO)
                  # =================================================================
                  echo -e "\n=== [BLOQUE ESO] Iniciando sincronización en 'external-secrets' ==="
                  
                  # Encapsulamos en un subshell para controlar fallos de forma independiente
                  (
                    set -e
                    NEED_UPDATE_ESO=false
                    
                    if kubectl get configmap vault-ca-cert -n external-secrets -o jsonpath='{.data.vault-ca\.crt}' > /tmp/eso-local.crt 2>/dev/null; then
                      LOCAL_ESO_FP=$(openssl x509 -noout -fingerprint -sha256 -in /tmp/eso-local.crt)
                      echo "Fingerprint ESO Local: $LOCAL_ESO_FP"
                      
                      if [ "$LOCAL_ESO_FP" != "$REMOTE_FP" ]; then
                        echo "=> Se detectó cambio de certificado para ESO. Procediendo con la actualización..."
                        NEED_UPDATE_ESO=true
                      else
                        echo "=> El certificado de ESO está actualizado. No se requieren cambios."
                      fi
                    else
                      echo "El ConfigMap de ESO no existe. Se creará por primera vez."
                      NEED_UPDATE_ESO=true
                    fi

                    if [ "$NEED_UPDATE_ESO" = true ]; then
                      echo "Actualizando ConfigMap vault-ca-cert de forma atómica..."
                      kubectl create configmap vault-ca-cert \
                        --from-file=vault-ca.crt=/tmp/vault-remote.crt \
                        -n external-secrets \
                        --dry-run=client -o yaml | kubectl apply -f -
                      
                      echo "Verificando si el operador ESO existe..."
                      if kubectl get deployment external-secrets -n external-secrets > /dev/null 2>&1; then
                        echo "El deployment existe. Realizando rollout restart de ESO..."
                        kubectl rollout restart deployment/external-secrets -n external-secrets
                        echo "Esperando a que los nuevos Pods de ESO estén listos..."
                        # Terminará con error si en 3 minutos (180s) el rollout se queda trabado
                        kubectl rollout status deployment/external-secrets -n external-secrets --timeout=180s
                      else
                        echo "El deployment 'external-secrets' no existe. Se omite el reinicio."
                      fi
                    fi
                  ) || { echo "❌ ERROR: Falló el bloque de External Secrets (ESO)." >&2; GLOBAL_STATUS=1; }


                  # =================================================================
                  # 3. BLOQUE SINCRO: VAULT SECRETS OPERATOR (VSO)
                  # =================================================================
                  echo -e "\n=== [BLOQUE VSO] Iniciando sincronización en 'vault-secrets-operator' ==="
                  
                  # Encapsulamos en un subshell para aislar fallos de ESO
                  (
                    set -e
                    NEED_UPDATE_VSO=false
                    
                    # Verificamos si el Secret existe de forma segura usando go-template y decodificación nativa
                    if kubectl get secret vault-ca-cert -n vault-secrets-operator -o go-template='{{index .data "ca.crt" | base64decode}}' > /tmp/vso-local.crt 2>/dev/null; then
                    # if kubectl get secret vault-ca-cert -n vault-secrets-operator -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/vso-local.crt 2>/dev/null; then
                      LOCAL_VSO_FP=$(openssl x509 -noout -fingerprint -sha256 -in /tmp/vso-local.crt)
                      echo "Fingerprint VSO Local: $LOCAL_VSO_FP"
                      
                      if [ "$LOCAL_VSO_FP" != "$REMOTE_FP" ]; then
                        echo "=> Se detectó cambio de certificado para VSO. Procediendo con la actualización..."
                        NEED_UPDATE_VSO=true
                      else
                        echo "=> El Secret de VSO está actualizado. No se requieren cambios."
                      fi
                    else
                      echo "El Secret de VSO no existe. Se creará por primera vez."
                      NEED_UPDATE_VSO=true
                    fi

                    if [ "$NEED_UPDATE_VSO" = true ]; then
                      echo "Actualizando Secret vault-ca-cert de forma atómica..."
                      kubectl create secret generic vault-ca-cert \
                        --from-file=ca.crt=/tmp/vault-remote.crt \
                        -n vault-secrets-operator \
                        --dry-run=client -o yaml | kubectl apply -f -
                      
                      echo "Verificando si el operador VSO existe..."
                      if kubectl get deployment vault-secrets-operator-controller-manager -n vault-secrets-operator > /dev/null 2>&1; then
                        echo "El deployment existe. Realizando rollout restart de VSO..."
                        kubectl rollout restart deployment/vault-secrets-operator-controller-manager -n vault-secrets-operator
                        echo "Esperando a que los nuevos Pods de VSO estén listos..."
                        # Terminará con error si en 3 minutos (180s) el rollout se queda trabado
                        kubectl rollout status deployment/vault-secrets-operator-controller-manager -n vault-secrets-operator --timeout=180s
                      else
                        echo "El deployment 'vault-secrets-operator-controller-manager' no existe. Se omite el reinicio."
                      fi
                    fi
                  ) || { echo "❌ ERROR: Falló el bloque de Vault Secrets Operator (VSO)." >&2; GLOBAL_STATUS=1; }


                  # =================================================================
                  # 4. EVALUACIÓN DE ESTADO FINAL
                  # =================================================================
                  echo -e "\n=== [RESUMEN FINAL] ==="
                  if [ $GLOBAL_STATUS -ne 0 ]; then
                    echo "ERROR: Una o más sincronizaciones fallaron. Revisa los logs superiores." >&2
                    exit 1
                  fi

                  echo "Sincronización completada exitosamente en todos los operadores."
              # Variables de entorno en caso de querer notificar un fallo por Telegram
              # Se debe configurar primero el bot en Telegram y crear un Secreto con estos datos
              # env:
              #   - name: TELEGRAM_TOKEN
              #     valueFrom:
              #       secretKeyRef:
              #         name: telegram-alert-secret
              #         key: TELEGRAM_TOKEN
              #   - name: TELEGRAM_CHAT_ID
              #     valueFrom:
              #       secretKeyRef:
              #         name: telegram-alert-secret
              #         key: TELEGRAM_CHAT_ID
              # Ya no necesitmo montar un volumen con la clave SSH del LXC de Vault
              # volumeMounts:
              #   - name: ssh-key-volume
              #     mountPath: /tmp/ssh
              #     readOnly: true
          # No requerimos conectarnos Vía SSH al servidor (el LXC) de Vault ya que la descarga del certificado se hará por CURL,
          # por tanto ya no necesitamos este volumen
          # volumes:
          #   - name: ssh-key-volume
          #     secret:
          #       secretName: vault-lxc-ssh-key
          #       defaultMode: 0600
