# Default values: https://artifacthub.io/packages/helm/cert-manager/cert-manager/1.21.0?modal=values

# Habilitar la instalación automática de CRDs requeridos
crds:
  enabled: true
  keep: true

# Configuración global de recursos y réplicas para producción
replicaCount: 1

# Activación del soporte nativo para Gateway API v1.4.1
extraArgs:
  - --enable-gateway-api

nodeSelector:
  # kubernetes.io/hostname: "worker-ops-02"
  custom-role: "ops"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Ajustes de seguridad compatibles con Talos OS y Cilium
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

prometheus:
  enabled: true
  servicemonitor:
    enabled: false

webhook:
  nodeSelector:
    # kubernetes.io/hostname: "worker-ops-02"
    custom-role: "ops"
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

cainjector:
  nodeSelector:
    # kubernetes.io/hostname: "worker-ops-02"
    custom-role: "ops"
  resources:
    requests:
      cpu: 30m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
