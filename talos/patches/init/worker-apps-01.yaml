machine:
  nodeLabels:
    topology.kubernetes.io/zone: "pmx-01"
    custom-role: apps
  network:
    interfaces:
      - interface: eth0
        dhcp: false
        addresses:
          - 192.168.0.41/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.0.1
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
    extraConfig:
      serverTLSBootstrap: true
    clusterDNS:
      - 10.96.0.10
    extraMounts:
      - destination: /var/openebs/local
        type: bind
        source: /var/openebs/local
        options:
          - bind
          - rshared
          - rw
  features:
    hostDNS:
      enabled: false
      forwardKubeDNSToHost: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: worker-apps-01
auto: off