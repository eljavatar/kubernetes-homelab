# Metrics Server (chart 3.13.1)
#
# Mismo patrón que Descheduler: chart desde su repositorio Helm + valueFiles
# leídos de nuestro repositorio Git mediante 'ref: values'.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    # Después de los operadores base; el orden exacto depende de las dependencias reales
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab-platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.13.1
      helm:
        releaseName: metrics-server
        valueFiles:
          - $values/k8s/deployments/metrics-server-values.yaml
    - repoURL: https://github.com/eljavatar/kubernetes-homelab
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
