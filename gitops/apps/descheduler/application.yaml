# Descheduler (chart 0.36.0)
#
# Patrón de múltiples "sources":
#   1. El chart, servido por su repositorio Helm.
#   2. Nuestro repositorio Git, referenciado con 'ref: values', del que se leen
#      los valueFiles (los mismos que usa Terraform en k8s/deployments/).
#
# OJO: si este release es gestionado por Terraform (terraform/k8s-bootstrap.tf),
# NO se debe crear esta Application para evitar que dos dueños peleen por el
# mismo release de Helm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
  annotations:
    # Se instala después de los operadores base del clúster
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: homelab-platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/descheduler/
      chart: descheduler
      targetRevision: 0.36.0
      helm:
        releaseName: descheduler
        valueFiles:
          - $values/k8s/deployments/descheduler-values.yaml
    - repoURL: https://github.com/eljavatar/kubernetes-homelab
      targetRevision: main
      ref: values
  destination:
    # API server del propio clúster donde corre Argo CD
    server: https://kubernetes.default.svc
    # Namespace real del release (no el nombre de la carpeta)
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
