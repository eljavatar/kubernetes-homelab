# OpenFeature Operator (chart 0.9.3)
#
# Este componente vive en su propio namespace (open-feature-operator-system),
# lo que demuestra que 'destination.namespace' NO tiene por qué coincidir con el
# nombre de la carpeta del componente.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-feature-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab-platform
  # O solo source: en caso de ser un único source
  sources:
    - repoURL: https://open-feature.github.io/open-feature-operator
      chart: open-feature-operator
      targetRevision: 0.9.3
      helm:
        releaseName: open-feature-operator
        valueFiles:
          - $values/k8s/bootstrap/deployments/open-feature-values.yaml
    - repoURL: https://github.com/eljavatar/kubernetes-homelab
      targetRevision: main # test/gitops-bootstrap
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Namespace real del release, distinto al de la carpeta (open-feature-operator)
    namespace: open-feature-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
